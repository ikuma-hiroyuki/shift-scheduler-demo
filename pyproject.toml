[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demo-mart-app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]",
    "bcrypt",
    "python-multipart",
    "arq>=0.26",
    "openpyxl>=3.1",
    "ortools>=9.8",
    "jpholiday>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/tests/*",
    "app/migrations/*",
    "app/scripts/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

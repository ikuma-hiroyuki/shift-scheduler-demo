name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: demomart
          POSTGRES_PASSWORD: demomart
          POSTGRES_DB: demomart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demomart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest with coverage
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://demomart:demomart@localhost:5432/demomart_test
          DATABASE_URL: postgresql+asyncpg://demomart:demomart@localhost:5432/demomart
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret
        run: |
          pytest --cov --cov-report=xml --cov-report=term

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (vitest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        run: npm install

      - name: Run vitest with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://demomart:demomart@db:5432/demomart
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demomart
      POSTGRES_PASSWORD: demomart
      POSTGRES_DB: demomart
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demomart"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

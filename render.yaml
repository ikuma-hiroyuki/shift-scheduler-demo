services:
  - type: web
    name: shift-scheduler-demo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    # 無料プランには Pre-Deploy Command が無いため、起動コマンド内で
    # マイグレーション + 管理者upsertを毎回実行する（どちらも冪等なので無害）。
    dockerCommand: >-
      sh -c "alembic upgrade head && python -m app.scripts.bootstrap_admin && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: RECAPTCHA_SECRET
        value: ""
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

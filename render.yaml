services:
  - type: web
    name: shift-scheduler-demo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    # 無料プランには Pre-Deploy Command が無いため、render-start.sh 内で
    # マイグレーション + 管理者upsertを毎回実行する（どちらも冪等なので無害）。
    dockerCommand: /app/render-start.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: RECAPTCHA_SECRET
        value: ""
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

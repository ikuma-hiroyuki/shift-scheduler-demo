services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5273:5273"
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules

  app:
    build:
      context: .
      target: dev
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DEBUG: "true"
      TEST_DATABASE_URL: "postgresql+asyncpg://demomart:demomart@db:5432/demomart_test"

  worker:
    build:
      context: .
      target: dev
    volumes:
      - ./app:/app/app
    command: arq app.tasks.worker.WorkerSettings
    environment:
      DEBUG: "true"

  db:
    ports:
      - "127.0.0.1:5432:5432"
